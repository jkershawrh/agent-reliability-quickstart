image:
  repository: quay.io/rh-ee-jkershaw/agent-reliability-quickstart
  digest: sha256:90776916eee2acd6f0ea45990337cc75a04bfe19ef4f8513af1d540e3c529b13
  pullPolicy: IfNotPresent
model:
  existingSecret: model-connection

guardrails:
  enabled: true
  endpoint: https://ar-guardrails:443
route:
  enabled: true
  # Keep the Route name short because OpenShift derives a host label from
  # <route>-<namespace>, and Launchpad seat namespaces are intentionally long.
  name: ar
profile:
  timeoutSeconds: 30
  maxAttempts: 2
  backoffSeconds: 0.25
  guardrailMode: enforce
  labFailureInjection: false
resources:
  api:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  mcp:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
