image:
  repository: quay.io/rh-ee-jkershaw/agent-reliability-quickstart
  digest: sha256:604331d4a050f47457e27c2191106aa3fa075d408514143cd9eac6da18dfc3fb
  pullPolicy: IfNotPresent
model:
  existingSecret: model-connection

guardrails:
  enabled: true
  # Leave empty to use the namespace-qualified service DNS name required by
  # the RHOAI-issued serving certificate.
  endpoint: ""
route:
  enabled: true
  # Keep the Route name short because OpenShift derives a host label from
  # <route>-<namespace>, and Launchpad seat namespaces are intentionally long.
  name: ar
profile:
  timeoutSeconds: 30
  maxAttempts: 2
  backoffSeconds: 0.25
  guardrailMode: enforce
  labFailureInjection: false
resources:
  api:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  mcp:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
