image:
  repository: quay.io/rh-ee-jkershaw/agent-reliability-quickstart
  digest: sha256:7aff969774fa4b3efac77de4525a046a9c36ce8609de77af20f1077ad17a79d1
  pullPolicy: IfNotPresent
model:
  existingSecret: model-connection

guardrails:
  enabled: true
  endpoint: https://ar-guardrails:443
route:
  enabled: true
  # Keep the Route name short because OpenShift derives a host label from
  # <route>-<namespace>, and Launchpad seat namespaces are intentionally long.
  name: ar
profile:
  timeoutSeconds: 30
  maxAttempts: 2
  backoffSeconds: 0.25
  guardrailMode: enforce
  labFailureInjection: false
resources:
  api:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  mcp:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
