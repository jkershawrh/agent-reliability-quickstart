apiVersion: apps/v1
kind: Deployment
metadata:
  name: noc-evidence-mcp
  labels: {app.kubernetes.io/name: noc-evidence-mcp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: noc-evidence-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: noc-evidence-mcp}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: quay.io/jkershawrh/agent-reliability-quickstart:latest
          command: [uvicorn, src.mcp:app, --host, 0.0.0.0, --port, "8080"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata: {name: noc-evidence-mcp}
spec:
  selector: {app.kubernetes.io/name: noc-evidence-mcp}
  ports: [{name: http, port: 8080, targetPort: http}]

