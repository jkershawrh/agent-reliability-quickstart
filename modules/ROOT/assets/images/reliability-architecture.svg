<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent reliability architecture</title>
  <desc id="desc">A NOC request passes through input guardrails, an orchestrator, read-only MCP tools, CPU model inference, evidence validation, and human approval on OpenShift.</desc>
  <rect width="1200" height="620" fill="#f5f5f5"/>
  <text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="700" fill="#151515">Reliable agent request path</text>
  <rect x="45" y="105" width="1110" height="420" rx="24" fill="#fff" stroke="#0066cc" stroke-width="4"/>
  <text x="75" y="145" font-family="sans-serif" font-size="22" font-weight="700" fill="#0066cc">Red Hat OpenShift tenant boundary</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#e7f1fa" stroke="#0066cc" stroke-width="3"><rect x="80" y="205" width="160" height="110" rx="12"/><rect x="285" y="205" width="160" height="110" rx="12"/><rect x="490" y="205" width="160" height="110" rx="12"/><rect x="695" y="205" width="160" height="110" rx="12"/><rect x="900" y="205" width="205" height="110" rx="12"/></g>
    <g fill="#151515" font-size="20" font-weight="700"><text x="160" y="250">Input</text><text x="160" y="278">guardrail</text><text x="365" y="250">Agent</text><text x="365" y="278">orchestrator</text><text x="570" y="250">Read-only</text><text x="570" y="278">MCP tools</text><text x="775" y="250">CPU model</text><text x="775" y="278">inference</text><text x="1002" y="250">Evidence validation</text><text x="1002" y="278">+ abstention</text></g>
    <g stroke="#ee0000" stroke-width="5" fill="none"><path d="M240 260h45"/><path d="M445 260h45"/><path d="M650 260h45"/><path d="M855 260h45"/></g>
    <g fill="#ee0000"><path d="M282 252l14 8-14 8z"/><path d="M487 252l14 8-14 8z"/><path d="M692 252l14 8-14 8z"/><path d="M897 252l14 8-14 8z"/></g>
    <rect x="365" y="390" width="470" height="80" rx="40" fill="#151515"/>
    <text x="600" y="425" fill="#fff" font-size="21" font-weight="700">Human approval remains mandatory</text><text x="600" y="450" fill="#d2d2d2" font-size="17">Recommendation is not authorization</text>
  </g>
  <text x="60" y="575" font-family="sans-serif" font-size="19" fill="#4f5255">OpenShift AI guardrails • MCP evidence • bounded inference • policy metadata • traceable outcome</text>
</svg>
