schema_version: quickstart.redhat.com/validation-matrix/v1
stages:
  - id: stage-0-contracts
    name: Contracts and secure defaults
    method: CDD
    threshold: 100
    required: true
    checks:
      - participant-workspace-served
      - failure-injection-disabled-by-default
      - mcp-tools-read-only
      - no-literal-secrets
  - id: stage-1-behavior
    name: Reliability behavior
    method: TDD
    threshold: 100
    required: true
    checks:
      - healthy-advice-grounded
      - prompt-injection-stops-before-tools
      - unauthorized-tool-denied
      - inference-disruption-degrades-without-fabrication
  - id: stage-2-components
    name: Component integration
    method: CBT
    threshold: 100
    required: true
    checks:
      - external-guardrail-decision-recorded
      - guardrail-outage-fallback-recorded
      - model-secret-external-to-git
      - qualification-pipeline-renders
  - id: stage-3-launchpad-lifecycle
    name: Launchpad lifecycle and scale
    method: EDD
    threshold: 100
    required: true
    checks:
      - one-seat-order-and-reclaim
      - clean-reorder
      - five-seat-isolation
      - twenty-five-seat-concurrency
      - zero-residue-reclaim
  - id: stage-4-participant-journey
    name: Participant experience
    method: BDD
    threshold: 100
    required: true
    checks:
      - showroom-opens
      - workspace-opens
      - healthy-scenario-completes
      - three-failure-scenarios-complete
      - qualification-scorecard-visible
