name: CI
on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish a signed, non-production intake candidate to GHCR
        type: boolean
        default: false
      expected_revision:
        description: Exact 40-character source commit to publish
        type: string
        required: false
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: make precommit
      - run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in Path('deploy').rglob('*.yaml'):
              list(yaml.safe_load_all(path.read_text()))
          PY

  publish_candidate:
    name: "Manual candidate: build, scan, sign, verify"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true && github.ref == 'refs/heads/main' }}
    needs: [validate]
    runs-on: ubuntu-latest
    environment: intake-candidate-publish
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/jkershawrh/agent-reliability-quickstart
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      PUBLISH_GATE: ${{ vars.CANDIDATE_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fail closed before registry writes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_REVISION" == "$GITHUB_SHA" ]]
          [[ "$PUBLISH_GATE" == true ]]
          [[ "$GITHUB_REPOSITORY" == jkershawrh/agent-reliability-quickstart ]]
          echo "IMAGE_TAG=intake-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build and smoke-test exact linux/amd64 source
        shell: bash
        run: |
          set -euo pipefail
          podman build --platform linux/amd64 \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            -t "localhost/agent-reliability:$IMAGE_TAG" -f Containerfile .
          podman run --rm --platform linux/amd64 --entrypoint python \
            "localhost/agent-reliability:$IMAGE_TAG" -c \
            'from fastapi.testclient import TestClient; from src.main import app; c=TestClient(app); assert c.get("/health").status_code == 200'
          podman save --format docker-archive \
            "localhost/agent-reliability:$IMAGE_TAG" | docker load
      - name: Reject fixable Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: "localhost/agent-reliability:${{ env.IMAGE_TAG }}"
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: json
      - name: Authenticate to GHCR
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/registry-auth"
          printf '%s' "$REGISTRY_TOKEN" | podman login \
            --authfile "$RUNNER_TEMP/registry-auth/config.json" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth/config.json" >> "$GITHUB_ENV"
      - name: Push unique candidate and capture digest
        shell: bash
        run: |
          set -euo pipefail
          podman tag "localhost/agent-reliability:$IMAGE_TAG" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          podman push --authfile "$REGISTRY_AUTH_FILE" \
            --digestfile "$RUNNER_TEMP/image.digest" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          digest="$(< "$RUNNER_TEMP/image.digest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_REF }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          output-file: ${{ runner.temp }}/candidate.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign and attest exact digest
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg repository "https://github.com/$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" --arg image "$IMAGE_REF" \
            --arg workflow "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source_repository:$repository,source_revision:$revision,subject_image:$image,workflow_run:$workflow,build_platform:"linux/amd64"}' \
            > "$RUNNER_TEMP/source-provenance.json"
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/candidate.spdx.json" "$IMAGE_REF"
          cosign attest --yes --type custom --predicate "$RUNNER_TEMP/source-provenance.json" "$IMAGE_REF"
      - name: Verify workflow identity and subject
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yaml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type custom --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$IMAGE_REF" >/dev/null
          printf 'Candidate image: %s\nSource revision: %s\nStatus: signed candidate only; no catalog activation\n' \
            "$IMAGE_REF" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
